<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>превью {{filename}}</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
        :root {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 400;
            background: #1f1f1f;
            color: #f8fafc;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #341e3b;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .filename {
            font-size: 15px;
            font-weight: 600;
            word-break: break-all;
            color: #cbd5e1;
        }
        .gallery-container {
            display: flex;
            flex-direction: row;
            gap: 4px;
        }
        .gallery-container::-webkit-scrollbar {
            width: 6px;
        }
        .gallery-container::-webkit-scrollbar-thumb {
            background: #624769;
            border-radius: 4px;
        }
        .btn-download {
            display: block;
            width: 100%;
            padding: 14px 0;
            margin-top: 18px;
            background: #dfc7e2;
            color: #1f1f1f;
            text-decoration: none;
            font-weight: bold;
            border-radius: 12px;
            font-size: 16px;
            transition: transform 0.2s, opacity 0.2s;
            box-sizing: border-box;
        }
        .btn-download:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .timer-badge {
            font-size: 12px;
            font-weight: 400;
            color: #dccee0;
        }
        .footer {
            display: flex;
            flex-direction: row;
            justify-content: center;
            margin-top: 16px;
            font-size: 12px;
            color: #83648b;
            gap: 4px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div id="media-title" class="filename">{{filename}}</div>
        {{player_html}}
        <div class="timer-badge">
            ссылка <span id="countdown">доступна ещё...</span>
        </div>
        <a href="{{download_url}}" class="btn-download" download>{{download_btn_text}}</a>
        <div class="footer">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 48 48" fill="rgb(204 113 252)">
                <path d="M41.4193 7.30899C41.4193 7.30899 45.3046 5.79399 44.9808 9.47328C44.8729 10.9883 43.9016 16.2908 43.1461 22.0262L40.5559 39.0159C40.5559 39.0159 40.3401 41.5048 38.3974 41.9377C36.4547 42.3705 33.5408 40.4227 33.0011 39.9898C32.5694 39.6652 24.9068 34.7955 22.2086 32.4148C21.4531 31.7655 20.5897 30.4669 22.3165 28.9519L33.6487 18.1305C34.9438 16.8319 36.2389 13.8019 30.8426 17.4812L15.7331 27.7616C15.7331 27.7616 14.0063 28.8437 10.7686 27.8698L3.75342 25.7055C3.75342 25.7055 1.16321 24.0823 5.58815 22.459C16.3807 17.3729 29.6555 12.1786 41.4193 7.30899Z"
                />
            </svg> <a href="https://t.me/{{bot_username}}" style="text-decoration: none; color: #83648b;">@{{bot_username}}</a></div>
    </div>
    <script>
        (function() {
            const expiresAtMs = {{expires_at}} * 1000;
            function updateTimer() {
                const now = Date.now();
                const diff = expiresAtMs - now;
                const el = document.getElementById('countdown');
                if (!el) return;
        
                if (diff <= 0) {
                    el.innerText = 'истекла';
                    el.style.color = '#ef4444';
                    return;
                }
        
                const hours = Math.floor(diff / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);
        
                let timeStr = '';
                if (hours > 0) timeStr += hours + 'ч ';
                timeStr += String(minutes).padStart(2, '0') + 'м ' + String(seconds).padStart(2, '0') + 'с';
                el.innerText = 'доступна ещё '+timeStr;
            }
            updateTimer();
            setInterval(updateTimer, 1000);
        })();
        document.addEventListener("DOMContentLoaded", function() {
                const audioEl = document.querySelector('audio');
                const titleEl = document.getElementById('media-title');
        
                if (audioEl && audioEl.src && typeof jsmediatags !== 'undefined') {
                    jsmediatags.read(audioEl.src, {
                        onSuccess: function(tag) {
                            const tags = tag.tags;
                            const artist = tags.artist ? tags.artist.trim() : '';
                            const title = tags.title ? tags.title.trim() : '';
        
                            if (artist && title) {
                                titleEl.innerText = `${artist} - ${title}`;
                                document.title = `${artist} - ${title}`;
                            } else if (title) {
                                titleEl.innerText = title;
                                document.title = title;
                            }
                        },
                        onError: function(error) {
                            console.log('ID3 tags not found or error:', error);
                        }
                    });
                }
            });
        const item = document.querySelector('.gallery-container');
        if (item != null) {
            item.addEventListener('wheel', (evt) => {
          evt.preventDefault();
          item.scrollLeft += evt.deltaY;
        });
        }
    </script>
</body>

</html>
