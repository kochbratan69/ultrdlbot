name: Build Python Binaries

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller
        shell: bash

      - name: Build with PyInstaller
        run: |
          OS_NAME=""
          EXT=""
          
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            OS_NAME="windows"
            EXT=".exe"
          else
            OS_NAME="linux"
          fi
          
          pyinstaller --onefile --name "bot-${OS_NAME}${EXT}" bot.py
          pyinstaller --onefile --name "worker-${OS_NAME}${EXT}" worker.py
        shell: bash

      # 🔑 Генерация SHA256 хэшей для каждого бинарника
      - name: Generate SHA256 Checksums
        run: |
          cd dist
          for file in *; do
            if [ -f "$file" ]; then
              sha256sum "$file" | awk '{print $1}' > "${file}.sha256"
            fi
          done
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-binaries-${{ matrix.os }}
          path: dist/*
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}