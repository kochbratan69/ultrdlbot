name: Build Python Binaries

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller
        shell: bash

      - name: Build for Linux (Ubuntu) with PyInstaller
        run: |
          EXT=""
          OS_NAME="linux"
          
          pyinstaller --onefile --name "dlbot-${OS_NAME}${EXT}" bot.py
          pyinstaller --onefile --name "dlworker-${OS_NAME}${EXT}" worker.py
          pyinstaller --onefile --name "dlupdater-${OS_NAME}${EXT}" updater.py
        shell: bash

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          for file in *; do
            if [ -f "$file" ]; then
              sha256sum "$file" | awk '{print $1}' > "${file}.sha256"
            fi
          done
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dlbot-binaries-${{ matrix.os }}
          path: dist/*
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}