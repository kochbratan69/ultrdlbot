name: Build Python Binaries

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        app: [bot, worker, updater]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller
        shell: bash

      - name: Build for Linux (Ubuntu) with PyInstaller
        run: |
          EXT=""
          OS_NAME="linux"
          
          if [ "${{ matrix.app }}" = "worker" ]; then
            pyinstaller --onefile --name "dl${{ matrix.app }}-${OS_NAME}${EXT}" --collect-all gallery_dl ${{ matrix.app }}.py
          else
            pyinstaller --onefile --name "dl${{ matrix.app }}-${OS_NAME}${EXT}" ${{ matrix.app }}.py
          fi
        shell: bash

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          for file in *; do
            if [ -f "$file" ]; then
              sha256sum "$file" | awk '{print $1}' > "${file}.sha256"
            fi
          done
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.os }}
          path: dist/*
          retention-days: 1
  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Скачиваем ВСЕ артефакты из всех параллельных сборок в одну папку
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}